<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warranty Status | CASA Parquet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="canonical" href="https://casa-parquet.vn/en/tinhtrangbaohanh.html" />
    <link rel="alternate" hreflang="vi" href="https://casa-parquet.vn/tinhtrangbaohanh.html" />
    <link rel="alternate" hreflang="en" href="https://casa-parquet.vn/en/tinhtrangbaohanh.html" />
    <link rel="alternate" hreflang="x-default" href="https://casa-parquet.vn/tinhtrangbaohanh.html" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Urbanist:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/tracuubaohanh.css">
<script src="https://www.google.com/recaptcha/api.js?render=6LfZ-YotAAAAAO4pktKGLZaHl0o7nLrShyF8R_PF"></script>
</head>
<body>

<main class="auth-wrapper">
    <div class="auth-card">
        
        <div id="loading-state" class="state-container">
            <div class="simple-loader"></div>
            <p>Retrieving warranty information from CASA Parquet...</p>
        </div>

        <div id="result-content" class="state-container" style="display:none;">
            </div>

        <div id="error-state" class="state-container" style="display:none;">
            <h2 class="auth-title">Information Not Found</h2>
            <p class="auth-subtitle">The information could not be found. The order number or phone number is not registered in our warranty system.</p>
            <div class="result-actions">
                <a href="/en/tracuubaohanh.html" class="btn-primary">Back to Warranty Lookup</a>
            </div>
        </div>

    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const customerID = urlParams.get('id');
    
    if (!customerID) {
        window.location.href = '/en/tracuubaohanh.html';
        return;
    }

   
    try {

        const API_URL = `https://script.google.com/macros/s/XXX_YOUR_ID_XXX/exec?action=getWarranty&id=${customerID}`;
        
        const response = await fetch(API_URL);
        const result = await response.json(); 

        if (result.status === "success") {
         
            showResult(result.data);
        } else {
     
            showError();
        }
    } catch (e) {
        showError();
    }
});

function showResult(data) {
    const resultContent = document.getElementById('result-content');
    document.getElementById('loading-state').style.display = 'none';
    resultContent.style.display = 'block';


    resultContent.innerHTML = `
        <div class="status-badge">● ${data.warrantyStatus}</div>
        <h1 class="auth-title">Warranty Certified</h1>
        <p class="auth-subtitle">CASA Parquet - European Excellence</p>

        <div class="warranty-info-group">
            <div class="info-row"><span class="label">Customer</span><span class="value">${data.customerName}</span></div>
            <div class="info-row"><span class="label">Product</span><span class="value">${data.productName}</span></div>
            <div class="info-row"><span class="label">Installation Date</span><span class="value">${data.installDate}</span></div>
            <div class="info-row"><span class="label">Warranty Expiry</span><span class="value expiry-highlight">${data.expiryDate}</span></div>
        </div>

        <div class="result-actions">
            <a href="/${data.pdfLink}" class="btn-primary" target="_blank">Download CO/CQ Certificate (PDF)</a>
            <a href="/en/index.html" class="btn-outline">Back to Home</a>
        </div>
    `;
}

function showError() {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
}
</script>

</body>
</html>
