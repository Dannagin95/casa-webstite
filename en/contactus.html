<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | CASA Parquet</title>

    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    
    <link rel="canonical" href="https://casa-parquet.vn/en/contactus.html" />

    <link rel="alternate" hreflang="vi" href="https://casa-parquet.vn/contactus.html" />
    <link rel="alternate" hreflang="en" href="https://casa-parquet.vn/en/contactus.html" />
    <link rel="alternate" hreflang="x-default" href="https://casa-parquet.vn/contactus.html" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@400;500;600;700&family=Alata&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cal+Sans&family=Quicksand:wght@400;500;600;700&family=Urbanist:wght@400;500;600;700&display=block" rel="stylesheet">


    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/contactus.css">


<script src="https://www.google.com/recaptcha/api.js?render=6LfZ-YotAAAAAO4pktKGLZaHl0o7nLrShyF8R_PF"></script>
</head>
<body class="contact-only-body">

    <header class="simple-contact-header">
        <a href="/en/index.html" class="logo">
        <img src="/image/images/logoblack.png" alt="CASA">
        </a>
    </header>

    <main class="contact-main-wrapper">
        <div class="casa-container-small">
    
            <nav class="contact-breadcrumb">
                <a href="/en/index.html"><strong>CASA</strong></a><span>/</span> Contact
            </nav>

            <div class="contact-card">
                <h1 class="contact-card-title">Contact</h1>
                
                <form class="contact-form" id="casa-contact-form">
    <div class="input-group">
        <label>Name<span class="required">*</span></label>
        <input type="text" name="fullname" required> </div>

    <div class="input-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" name="email" placeholder="your@gmail.com" required> </div>

    <div class="input-group">
        <label>Category <span class="required">*</span></label>
        <div class="select-wrapper">
            <select name="category" required> <option value="" disabled selected>Select a category</option>
                <option value="feedback">Feedback</option>
                <option value="warranty">Warranty</option>
                <option value="sizingenquiry">Size Consultation</option>
                <option value="other">Other</option>
            </select>
        </div>
    </div>

    <div class="input-group">
        <label>Message <span class="required">*</span></label>
        <textarea name="message" rows="5" required></textarea> </div>

    <div class="attach-wrapper">
        <label for="file-upload" class="attach-button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" />
            </svg>
            Attach files
        </label>
        <input type="file" id="file-upload" hidden multiple>
        <div id="file-list"></div>
        <p class="attach-note" id="file-count">Up to 10 files, maximum 5MB each.</p>
    </div>

    <button type="submit" class="contact-submit-btn" id="submit-btn">Submit</button>

    <p class="recaptcha-text">
        This site is protected by reCAPTCHA Enterprise and the Google <a href="https://policies.google.com/privacy" target="_blank">Privacy Policy</a> and <a href="https://policies.google.com/terms" target="_blank">Terms of Service</a> apply.
    </p>
</form>
            </div>

            <footer class="simple-contact-footer">
                <a href="/en/index.html"><strong>CASA</strong></a>
            </footer>
        </div>
    </main>

<script src="/js/contact.js"></script>
</body>
</html>
